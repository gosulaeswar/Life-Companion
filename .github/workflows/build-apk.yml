name: Build Android Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Check or restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::warning::app/google-services.json is missing. Offline trackers will work, but cloud AI features require adding GOOGLE_SERVICES_JSON in GitHub Actions secrets."
            fi
          fi

      - name: Prepare optional billing endpoints (.env)
        env:
          BILLING_VERIFICATION_URL: ${{ vars.BILLING_VERIFICATION_URL || secrets.BILLING_VERIFICATION_URL }}
          BILLING_PRICING_CONFIG_URL: ${{ vars.BILLING_PRICING_CONFIG_URL || secrets.BILLING_PRICING_CONFIG_URL }}
        run: |
          if [ -n "$BILLING_VERIFICATION_URL" ] || [ -n "$BILLING_PRICING_CONFIG_URL" ]; then
            : > .env
            if [ -n "$BILLING_VERIFICATION_URL" ]; then
              printf 'BILLING_VERIFICATION_URL=%s\n' "$BILLING_VERIFICATION_URL" >> .env
            fi
            if [ -n "$BILLING_PRICING_CONFIG_URL" ]; then
              printf 'BILLING_PRICING_CONFIG_URL=%s\n' "$BILLING_PRICING_CONFIG_URL" >> .env
            fi
          fi

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Run Android Lint
        run: gradle :app:lintDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Build Debug APK
        env:
          FIREBASE_APPCHECK_DEBUG_TOKEN: ${{ secrets.FIREBASE_APPCHECK_DEBUG_TOKEN }}
        run: gradle :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LifeWeave-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
